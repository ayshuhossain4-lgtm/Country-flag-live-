
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Country Flag Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08051a;color:#fff;font-family:Arial,Helvetica,sans-serif}
.app{min-height:100vh;background:linear-gradient(#ffbe35,#ff8b1f 45%,#641c34 100%);padding-bottom:55px}
.top{height:54px;background:#050505;display:flex;align-items:center;padding:7px 12px;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#fff,#e33);display:grid;place-items:center;font-size:19px}
.handle{font-weight:800;font-size:16px}.sub{margin-left:auto;background:#fff;color:#111;padding:10px 17px;border-radius:24px;font-weight:700}
.info{margin:8px 5%;background:#f6f0e6;border:3px solid #3c1748;border-radius:24px;color:#32163f;text-align:center;padding:7px;font-weight:900;font-size:14px;box-shadow:0 3px 0 #8b4c0b}
.alert{padding:5px 8%;font-size:17px;font-weight:900;color:#351239}.alert b{color:#178e43}
.xp{position:absolute;left:12px;margin-top:-2px;background:#43265d;border-radius:18px;padding:5px 10px;font-size:12px;font-weight:bold}
.panel{margin:3px 3px 8px;background:linear-gradient(145deg,#27124f,#402070);border:4px solid #e6a72c;border-radius:18px;box-shadow:0 5px 0 #35154d;padding:18px 8px 14px}
.panel-title{margin:-8px 4px 10px auto;width:max-content;background:#f6d66d;color:#3b1746;border:3px solid #4d2357;border-radius:18px;padding:5px 14px;font-weight:900}
.seats{display:flex;justify-content:space-around;gap:7px}.seat{text-align:center;width:31%;font-weight:800}.medal{height:85px;border-radius:50%;border:7px solid #d6aa36;display:grid;place-items:center;font-size:35px;background:#2a1550;box-shadow:inset 0 0 0 3px #6c4b1d}.seat:nth-child(2) .medal{border-color:#b8c1ca}.seat:nth-child(3) .medal{border-color:#9a6329}.seat small{display:block;margin-top:6px}.price{display:inline-block;margin-top:5px;background:#ffe066;color:#35163e;border-radius:15px;padding:3px 10px}
.podium{display:flex;gap:5px;align-items:stretch;padding:0 8px}.card{flex:1;background:#fff0dc;color:#2b1731;border:3px solid #5b234b;border-radius:11px;text-align:center;overflow:hidden}.card.first{transform:translateY(-4px)}.card .flag{font-size:28px}.card strong{font-size:20px}.place{background:#ffd45d;padding:3px;font-weight:900}.second .place{background:#ddd}.third .place{background:#e8aa84}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px 9px}.country{background:rgba(255,255,255,.96);color:#111;border:3px solid #3c1647;border-radius:8px;text-align:center;padding:4px 2px;min-width:0}.flag{font-size:29px;line-height:32px}.country .name{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:19px;font-weight:900;margin-top:2px;text-shadow:1px 1px #fff}
.feed{position:fixed;left:0;right:0;bottom:47px;pointer-events:none;padding:0 12px;display:flex;flex-direction:column;gap:4px}.msg{align-self:flex-start;background:rgba(25,17,39,.72);border-radius:18px;padding:5px 10px;font-size:13px;font-weight:800;text-shadow:1px 1px #000}.msg b{color:#fff}.msg i{color:#ffd44c;font-style:normal}.status{position:fixed;right:8px;top:63px;background:#111b;color:#fff;border-radius:15px;padding:5px 9px;font-size:11px}
.test{position:fixed;bottom:0;left:0;right:0;background:#070707;padding:7px;display:flex;gap:5px}.test input{min-width:0;flex:1;border:0;border-radius:8px;padding:8px}.test button{border:0;border-radius:8px;padding:0 12px;font-weight:bold}
@media(min-width:700px){.app{max-width:480px;margin:auto}.feed,.test,.status{max-width:480px;margin:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="avatar">🌍</div><div class="handle">@YourChannel</div><div class="sub">Subscribe</div><div>•••</div></div>
  <div class="info">💬 1 MESSAGE = 1 POINT &nbsp; • &nbsp; 💰 SUPER CHAT $1 = 1,000 POINTS</div>
  <div class="alert"><span class="xp">♕ 5 XP</span> <span id="alert">@Viewer → Country <b>+1</b></span></div>

  <section class="panel">
    <div class="panel-title">💰 TOP SUPER CHATS</div>
    <div class="seats">
      <div class="seat"><div class="medal">?</div><small>🥇 Open seat</small><span class="price">$1 = 1,000</span></div>
      <div class="seat"><div class="medal">?</div><small>🥈 Open seat</small><span class="price">$1 = 1,000</span></div>
      <div class="seat"><div class="medal">?</div><small>🥉 Open seat</small><span class="price">$1 = 1,000</span></div>
    </div>
  </section>

  <div id="podium" class="podium"></div>
  <div id="grid" class="grid"></div>
  <div id="feed" class="feed"></div>
  <div class="status" id="status">Connecting…</div>
  <div class="test"><input id="author" placeholder="@viewer"><input id="message" placeholder="Type country for test"><button onclick="sendTest()">TEST</button></div>
</div>

<script>
const flags={
Bangladesh:"🇧🇩",India:"🇮🇳",Pakistan:"🇵🇰",Nepal:"🇳🇵",Bhutan:"🇧🇹","Sri Lanka":"🇱🇰",
Thailand:"🇹🇭",Vietnam:"🇻🇳",Indonesia:"🇮🇩",Malaysia:"🇲🇾",Philippines:"🇵🇭",
Brazil:"🇧🇷","United States":"🇺🇸",Japan:"🇯🇵","South Korea":"🇰🇷",China:"🇨🇳",Russia:"🇷🇺",
Germany:"🇩🇪",France:"🇫🇷",Italy:"🇮🇹",Spain:"🇪🇸",Portugal:"🇵🇹",Canada:"🇨🇦",
Australia:"🇦🇺","New Zealand":"🇳🇿",Mexico:"🇲🇽",Turkey:"🇹🇷",Iran:"🇮🇷",Iraq:"🇮🇶",
Qatar:"🇶🇦","Saudi Arabia":"🇸🇦","United Arab Emirates":"🇦🇪",Egypt:"🇪🇬",Morocco:"🇲🇦",
Albania:"🇦🇱",Kosovo:"🇽🇰",Greece:"🇬🇷",Norway:"🇳🇴",Sweden:"🇸🇪",Finland:"🇫🇮",
Denmark:"🇩🇰",Poland:"🇵🇱",Ukraine:"🇺🇦",Romania:"🇷🇴","South Africa":"🇿🇦",
Nigeria:"🇳🇬",Ghana:"🇬🇭",Kenya:"🇰🇪",Argentina:"🇦🇷",Chile:"🇨🇱",Colombia:"🇨🇴",
Peru:"🇵🇪",Uruguay:"🇺🇾"
};
function render(s){
 const rows=Object.entries(s.scores||{}).sort((a,b)=>b[1]-a[1]);
 const top=rows.slice(0,3);
 document.getElementById("podium").innerHTML=top.map((x,i)=>`<div class="card ${i===0?'first':''}"><div>${flags[x[0]]||'🏳️'} <strong>${x[0]}</strong> ${x[1].toLocaleString()}</div><div class="place">${i===0?'1st':i===1?'2nd':'3rd'}</div></div>`).join("");
 document.getElementById("grid").innerHTML=rows.map(x=>`<div class="country"><div class="flag">${flags[x[0]]||'🏳️'}</div><div class="name">${x[0]}</div><div class="score">${x[1].toLocaleString()}</div></div>`).join("");
 const feed=(s.recent||[]).slice(0,5);
 document.getElementById("feed").innerHTML=feed.map(m=>`<div class="msg">@${m.author} → ${flags[m.country]||''} ${m.country} <i>+${m.amount}</i></div>`).join("");
 if(feed[0]) document.getElementById("alert").innerHTML=`@${feed[0].author} → ${feed[0].country} <b>+${feed[0].amount}</b>`;
 document.getElementById("status").textContent=s.connected?"🟢 LIVE CHAT":"🔴 "+(s.error||"Not connected");
}
async function refresh(){try{const r=await fetch("/api/state");render(await r.json())}catch(e){document.getElementById("status").textContent="🔴 Server offline"}}
async function sendTest(){
 const author=document.getElementById("author").value||"TestViewer";
 const message=document.getElementById("message").value;
 await fetch("/api/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({author,message})});
 document.getElementById("message").value=""; refresh();
}
setInterval(refresh,1500);refresh();
</script>
</body>
</html>
